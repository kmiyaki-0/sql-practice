<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SQL Practice | SkillScope</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    /* =========================
       サイドバー
    ========================= */

    .sidebar {
      background: #161b22;
      border-right: 1px solid #30363d;
      padding: 20px;
    }

    .sidebar h1 {
      margin-top: 0;
      margin-bottom: 5px;
      color: #58a6ff;
      font-size: 24px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-top: 0;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 25px;
    }

    .question-button {
      width: 100%;
      padding: 12px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
    }

    .question-button:hover {
      background: #21262d;
      border-color: #8b949e;
    }

    .question-button.active {
      border-color: #58a6ff;
      background: #1f2937;
    }

    .question-button.correct {
      border-color: #3fb950;
      color: #3fb950;
    }

    .progress {
      margin-top: 25px;
      padding: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      font-size: 14px;
    }

    /* =========================
       メイン
    ========================= */

    .main {
      padding: 30px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .question-card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 22px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .question-card h2 {
      margin-top: 0;
      color: #f0f6fc;
    }

    .question-card h3 {
      margin-top: 25px;
      color: #c9d1d9;
    }

    .schema {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      color: #c9d1d9;
      line-height: 1.5;
    }

    /* =========================
       SQLエディタ
    ========================= */

    .editor-title {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;

      font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;

      font-size: 16px;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.15);
    }

    /* =========================
       ボタン
    ========================= */

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button.action {
      padding: 11px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 15px;
      font-weight: 600;
      transition: 0.15s;
    }

    button.action:hover {
      filter: brightness(1.1);
    }

    #runButton {
      background: #238636;
    }

    #judgeButton {
      background: #1f6feb;
    }

    #resetButton {
      background: #6e7681;
    }

    /* =========================
       メッセージ
    ========================= */

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 6px;
      display: none;
    }

    .message.success {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid #3fb950;
      color: #3fb950;
    }

    .message.error {
      display: block;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #ff7b72;
    }

    .message.info {
      display: block;
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid #58a6ff;
      color: #79c0ff;
    }

    /* =========================
       実行結果
    ========================= */

    .result-area {
      margin-top: 30px;
    }

    .result-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: #161b22;
    }

    th,
    td {
      border: 1px solid #30363d;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #21262d;
      color: #58a6ff;
    }

    tr:hover td {
      background: #1c2128;
    }

    /* =========================
       スマホ対応
    ========================= */

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid #30363d;
      }

      .main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       左：問題一覧
  ========================== -->

  <aside class="sidebar">

    <h1>SQL Practice</h1>

    <p class="subtitle">
      SkillScope SQL練習環境
    </p>

    <div
      id="questionList"
      class="question-list"
    >
      読み込み中...
    </div>

    <div
      id="progress"
      class="progress"
    >
      正解数: 0 / 0
    </div>

  </aside>


  <!-- =========================
       右：問題・SQL入力
  ========================== -->

  <main class="main">

    <div class="question-card">

      <h2 id="questionTitle">
        問題を読み込み中...
      </h2>

      <p id="questionText"></p>

      <h3>使用テーブル</h3>

      <pre
        id="schema"
        class="schema"
      ></pre>

    </div>


    <h2 class="editor-title">
      SQLを書く
    </h2>


    <textarea
      id="sqlInput"
      spellcheck="false"
      placeholder="ここにSQLを書いてください"
    ></textarea>


    <div class="buttons">

      <button
        id="runButton"
        class="action"
      >
        SQLを実行
      </button>

      <button
        id="judgeButton"
        class="action"
      >
        正解判定
      </button>

      <button
        id="resetButton"
        class="action"
      >
        入力をリセット
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div class="result-area">

      <h2>実行結果</h2>

      <div
        id="result"
        class="result-wrapper"
      ></div>

    </div>

  </main>

</div>


<!-- =========================
     sql.js
========================== -->

<script
  src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"
></script>


<script>

  // ==========================================
  // グローバル変数
  // ==========================================

  let SQL;

  let questions = [];

  let currentQuestionIndex = 0;

  const solvedQuestions = new Set();


  // ==========================================
  // SQLite DB作成
  //
  // SQL実行のたびに新しいDBを作成する。
  // DROPやUPDATEを実行されても、
  // 次回は元のDBに戻る。
  // ==========================================

  function createDatabase() {

    const db = new SQL.Database();


    db.run(`

      CREATE TABLE users (

        id INTEGER PRIMARY KEY,

        name TEXT NOT NULL,

        age INTEGER NOT NULL

      );


      INSERT INTO users
        (id, name, age)
      VALUES

        (1, 'Taro', 25),

        (2, 'Hanako', 30),

        (3, 'Ken', 19),

        (4, 'Yuki', 22);


      CREATE TABLE orders (

        id INTEGER PRIMARY KEY,

        user_id INTEGER NOT NULL,

        product TEXT NOT NULL,

        amount INTEGER NOT NULL

      );


      INSERT INTO orders
        (id, user_id, product, amount)
      VALUES

        (1, 1, 'Keyboard', 8000),

        (2, 2, 'Mouse', 3000),

        (3, 1, 'Monitor', 25000),

        (4, 4, 'Headphones', 12000);

    `);


    return db;
  }


  // ==========================================
  // 初期化
  // ==========================================

  async function initialize() {

    try {

      showMessage(
        "SQL練習環境を読み込み中...",
        "info"
      );


      // sql.js 読み込み
      SQL = await initSqlJs({

        locateFile: file =>

          `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`

      });


      // questions.json 読み込み
      const response =
        await fetch("./questions.json");


      if (!response.ok) {

        throw new Error(
          `questions.json の読み込みに失敗しました（${response.status}）`
        );

      }


      questions =
        await response.json();


      if (
        !Array.isArray(questions) ||
        questions.length === 0
      ) {

        throw new Error(
          "questions.json に問題が登録されていません。"
        );

      }


      // 最初の問題を表示
      renderQuestionList();

      loadQuestion(0);

      updateProgress();

      hideMessage();

    }

    catch (error) {

      console.error(error);


      document.getElementById(
        "questionTitle"
      ).textContent =
        "読み込みエラー";


      document.getElementById(
        "questionText"
      ).textContent =
        "問題データを読み込めませんでした。";


      showMessage(
        `初期化エラー: ${error.message}`,
        "error"
      );

    }

  }


  // ==========================================
  // 問題一覧
  // ==========================================

  function renderQuestionList() {

    const list =
      document.getElementById(
        "questionList"
      );


    list.innerHTML = "";


    questions.forEach(
      (question, index) => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "question-button";


        if (
          index ===
          currentQuestionIndex
        ) {

          button.classList.add(
            "active"
          );

        }


        if (
          solvedQuestions.has(index)
        ) {

          button.classList.add(
            "correct"
          );

        }


        button.textContent =

          `${solvedQuestions.has(index) ? "✓ " : ""}${question.title}`;


        button.addEventListener(

          "click",

          () => {

            loadQuestion(index);

          }

        );


        list.appendChild(button);

      }
    );

  }


  // ==========================================
  // 問題を表示
  // ==========================================

  function loadQuestion(index) {

    currentQuestionIndex = index;


    const question =
      questions[index];


    document.getElementById(
      "questionTitle"
    ).textContent =
      question.title;


    document.getElementById(
      "questionText"
    ).textContent =
      question.text;


    document.getElementById(
      "schema"
    ).textContent =
      question.schema;


    document.getElementById(
      "sqlInput"
    ).value =
      question.starter || "";


    document.getElementById(
      "result"
    ).innerHTML = "";


    hideMessage();

    renderQuestionList();

  }


  // ==========================================
  // SQL実行
  // ==========================================

  function runSQL() {

    if (!SQL) {

      showMessage(
        "SQLiteを読み込み中です。",
        "error"
      );

      return;

    }


    const sql =
      document.getElementById(
        "sqlInput"
      ).value.trim();


    if (!sql) {

      showMessage(
        "SQLを入力してください。",
        "error"
      );

      return;

    }


    const db =
      createDatabase();


    try {

      const results =
        db.exec(sql);


      displayResults(results);


      showMessage(
        "SQLを実行しました。",
        "info"
      );

    }

    catch (error) {

      document.getElementById(
        "result"
      ).innerHTML = "";


      showMessage(
        `SQLエラー: ${error.message}`,
        "error"
      );

    }

    finally {

      db.close();

    }

  }


  // ==========================================
  // 正解判定
  // ==========================================

  function judgeSQL() {

    if (!SQL) {

      showMessage(
        "SQLiteを読み込み中です。",
        "error"
      );

      return;

    }


    const sql =
      document.getElementById(
        "sqlInput"
      ).value.trim();


    if (!sql) {

      showMessage(
        "SQLを入力してください。",
        "error"
      );

      return;

    }


    const question =
      questions[
        currentQuestionIndex
      ];


    const userDB =
      createDatabase();


    const answerDB =
      createDatabase();


    try {

      // ユーザーが書いたSQL
      const userResult =
        userDB.exec(sql);


      // questions.jsonの模範解答
      const answerResult =
        answerDB.exec(
          question.answer
        );


      // ユーザーの実行結果を表示
      displayResults(
        userResult
      );


      // SQL文ではなく
      // 実行結果を比較
      if (
        compareResults(
          userResult,
          answerResult
        )
      ) {

        solvedQuestions.add(
          currentQuestionIndex
        );


        showMessage(
          "正解です！ 🎉",
          "success"
        );


        renderQuestionList();

        updateProgress();

      }

      else {

        showMessage(
          "不正解です。実行結果を確認して、もう一度考えてみてください。",
          "error"
        );

      }

    }

    catch (error) {

      document.getElementById(
        "result"
      ).innerHTML = "";


      showMessage(
        `SQLエラー: ${error.message}`,
        "error"
      );

    }

    finally {

      userDB.close();

      answerDB.close();

    }

  }


  // ==========================================
  // 実行結果比較
  // ==========================================

  function compareResults(
    userResults,
    answerResults
  ) {

    // SELECT結果の数が違う
    if (
      userResults.length !==
      answerResults.length
    ) {

      return false;

    }


    for (
      let i = 0;
      i < userResults.length;
      i++
    ) {

      const user =
        userResults[i];


      const answer =
        answerResults[i];


      // 列名比較
      if (

        JSON.stringify(
          user.columns
        )

        !==

        JSON.stringify(
          answer.columns
        )

      ) {

        return false;

      }


      // 値比較
      if (

        JSON.stringify(
          user.values
        )

        !==

        JSON.stringify(
          answer.values
        )

      ) {

        return false;

      }

    }


    return true;

  }


  // ==========================================
  // 実行結果表示
  // ==========================================

  function displayResults(results) {

    const resultDiv =
      document.getElementById(
        "result"
      );


    resultDiv.innerHTML = "";


    if (
      results.length === 0
    ) {

      resultDiv.textContent =
        "SQLは正常に実行されました。";

      return;

    }


    results.forEach(
      result => {

        const table =
          document.createElement(
            "table"
          );


        // ヘッダー
        const thead =
          document.createElement(
            "thead"
          );


        const headerRow =
          document.createElement(
            "tr"
          );


        result.columns.forEach(
          column => {

            const th =
              document.createElement(
                "th"
              );


            th.textContent =
              column;


            headerRow.appendChild(
              th
            );

          }
        );


        thead.appendChild(
          headerRow
        );


        table.appendChild(
          thead
        );


        // データ
        const tbody =
          document.createElement(
            "tbody"
          );


        result.values.forEach(
          row => {

            const tr =
              document.createElement(
                "tr"
              );


            row.forEach(
              value => {

                const td =
                  document.createElement(
                    "td"
                  );


                td.textContent =

                  value === null

                    ? "NULL"

                    : value;


                tr.appendChild(
                  td
                );

              }
            );


            tbody.appendChild(
              tr
            );

          }
        );


        table.appendChild(
          tbody
        );


        resultDiv.appendChild(
          table
        );

      }
    );

  }


  // ==========================================
  // SQL入力リセット
  // ==========================================

  function resetInput() {

    if (
      questions.length === 0
    ) {

      return;

    }


    document.getElementById(
      "sqlInput"
    ).value =

      questions[
        currentQuestionIndex
      ].starter || "";


    document.getElementById(
      "result"
    ).innerHTML = "";


    hideMessage();

  }


  // ==========================================
  // メッセージ表示
  // ==========================================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      `message ${type}`;

  }


  function hideMessage() {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      "";


    message.className =
      "message";

  }


  // ==========================================
  // 正解数表示
  // ==========================================

  function updateProgress() {

    document.getElementById(
      "progress"
    ).textContent =

      `正解数: ${solvedQuestions.size} / ${questions.length}`;

  }


  // ==========================================
  // ボタンイベント
  // ==========================================

  document.getElementById(
    "runButton"
  ).addEventListener(
    "click",
    runSQL
  );


  document.getElementById(
    "judgeButton"
  ).addEventListener(
    "click",
    judgeSQL
  );


  document.getElementById(
    "resetButton"
  ).addEventListener(
    "click",
    resetInput
  );


  // Ctrl + Enter でもSQL実行
  document.getElementById(
    "sqlInput"
  ).addEventListener(
    "keydown",
    event => {

      if (
        event.ctrlKey &&
        event.key === "Enter"
      ) {

        event.preventDefault();

        runSQL();

      }

    }
  );


  // ==========================================
  // アプリ開始
  // ==========================================

  initialize();

</script>

</body>
</html>
