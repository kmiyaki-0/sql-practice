<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #161b22;
      border-right: 1px solid #30363d;
      padding: 20px;
    }

    .sidebar h1 {
      color: #58a6ff;
      font-size: 24px;
      margin-top: 0;
    }

    .sidebar p {
      color: #8b949e;
      font-size: 14px;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .question-button {
      width: 100%;
      padding: 12px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
    }

    .question-button:hover {
      background: #21262d;
    }

    .question-button.active {
      border-color: #58a6ff;
      background: #1f2937;
    }

    .question-button.correct {
      border-color: #3fb950;
    }

    .main {
      padding: 30px;
      max-width: 1100px;
      width: 100%;
    }

    .question-card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .question-card h2 {
      margin-top: 0;
    }

    .schema {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      color: #c9d1d9;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      font-family: Consolas, monospace;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button.action {
      padding: 11px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 15px;
    }

    #runButton {
      background: #238636;
    }

    #judgeButton {
      background: #1f6feb;
    }

    #resetButton {
      background: #6e7681;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 6px;
      display: none;
    }

    .message.success {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid #3fb950;
      color: #3fb950;
    }

    .message.error {
      display: block;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #ff7b72;
    }

    .message.info {
      display: block;
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid #58a6ff;
      color: #79c0ff;
    }

    .result-area {
      margin-top: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: #161b22;
    }

    th,
    td {
      border: 1px solid #30363d;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #21262d;
      color: #58a6ff;
    }

    .progress {
      margin-top: 20px;
      color: #8b949e;
    }

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid #30363d;
      }

      .main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <h1>SQL Practice</h1>
    <p>SkillScope SQL練習環境</p>

    <div id="questionList" class="question-list"></div>

    <div id="progress" class="progress">
      正解数: 0 / 0
    </div>
  </aside>

  <main class="main">

    <div class="question-card">
      <h2 id="questionTitle"></h2>
      <p id="questionText"></p>

      <h3>使用テーブル</h3>
      <pre id="schema" class="schema"></pre>
    </div>

    <h2>SQLを書く</h2>

    <textarea
      id="sqlInput"
      spellcheck="false"
      placeholder="ここにSQLを書いてください"
    ></textarea>

    <div class="buttons">
      <button id="runButton" class="action">
        SQLを実行
      </button>

      <button id="judgeButton" class="action">
        正解判定
      </button>

      <button id="resetButton" class="action">
        入力をリセット
      </button>
    </div>

    <div id="message" class="message"></div>

    <div class="result-area">
      <h2>実行結果</h2>
      <div id="result"></div>
    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>

<script>

  let SQL;

  let currentQuestionIndex = 0;

  const solvedQuestions = new Set();


  // ==============================
  // 問題データ
  // ==============================

  const questions = [

    {
      title: "問題1：SELECT 基礎",

      text:
        "users テーブルのすべての列・すべての行を取得してください。",

      starter:
        "SELECT *\nFROM users;",

      answer:
        "SELECT * FROM users;",

      schema:
`users
-------------------------
id | name   | age
1  | Taro   | 25
2  | Hanako | 30
3  | Ken    | 19
4  | Yuki   | 22`
    },

    {
      title: "問題2：WHERE",

      text:
        "users テーブルから、age が20以上のユーザーを取得してください。",

      starter:
        "SELECT *\nFROM users\nWHERE ",

      answer:
        "SELECT * FROM users WHERE age >= 20;",

      schema:
`users
-------------------------
id | name   | age
1  | Taro   | 25
2  | Hanako | 30
3  | Ken    | 19
4  | Yuki   | 22`
    },

    {
      title: "問題3：ORDER BY",

      text:
        "users テーブルを age の高い順に並べてください。",

      starter:
        "SELECT *\nFROM users\nORDER BY ",

      answer:
        "SELECT * FROM users ORDER BY age DESC;",

      schema:
`users
-------------------------
id | name   | age
1  | Taro   | 25
2  | Hanako | 30
3  | Ken    | 19
4  | Yuki   | 22`
    },

    {
      title: "問題4：COUNT",

      text:
        "users テーブルに何人のユーザーがいるか取得してください。列名は count にしてください。",

      starter:
        "SELECT ",

      answer:
        "SELECT COUNT(*) AS count FROM users;",

      schema:
`users
-------------------------
id | name   | age
1  | Taro   | 25
2  | Hanako | 30
3  | Ken    | 19
4  | Yuki   | 22`
    },

    {
      title: "問題5：JOIN",

      text:
        "注文したユーザー名、商品名、金額を取得してください。orders.id の昇順で並べてください。",

      starter:
`SELECT
FROM users
JOIN orders
  ON `,

      answer:
`SELECT users.name, orders.product, orders.amount
FROM users
JOIN orders
ON users.id = orders.user_id
ORDER BY orders.id;`,

      schema:
`users
-------------------------
id | name   | age
1  | Taro   | 25
2  | Hanako | 30
3  | Ken    | 19
4  | Yuki   | 22


orders
----------------------------------
id | user_id | product    | amount
1  | 1       | Keyboard   | 8000
2  | 2       | Mouse      | 3000
3  | 1       | Monitor    | 25000
4  | 4       | Headphones | 12000`
    },

    {
      title: "問題6：GROUP BY",

      text:
        "ユーザーごとの注文金額合計を取得してください。name と total を表示し、total の高い順に並べてください。",

      starter:
`SELECT
FROM users
JOIN orders
  ON
GROUP BY
ORDER BY `,

      answer:
`SELECT users.name, SUM(orders.amount) AS total
FROM users
JOIN orders
ON users.id = orders.user_id
GROUP BY users.id, users.name
ORDER BY total DESC;`,

      schema:
`users
-------------------------
id | name   | age
1  | Taro   | 25
2  | Hanako | 30
3  | Ken    | 19
4  | Yuki   | 22


orders
----------------------------------
id | user_id | product    | amount
1  | 1       | Keyboard   | 8000
2  | 2       | Mouse      | 3000
3  | 1       | Monitor    | 25000
4  | 4       | Headphones | 12000`
    }

  ];


  // ==============================
  // SQLite DB作成
  // ==============================

  function createDatabase() {

    const db = new SQL.Database();

    db.run(`
      CREATE TABLE users (
        id INTEGER PRIMARY KEY,
        name TEXT NOT NULL,
        age INTEGER NOT NULL
      );

      INSERT INTO users (id, name, age) VALUES
        (1, 'Taro', 25),
        (2, 'Hanako', 30),
        (3, 'Ken', 19),
        (4, 'Yuki', 22);


      CREATE TABLE orders (
        id INTEGER PRIMARY KEY,
        user_id INTEGER NOT NULL,
        product TEXT NOT NULL,
        amount INTEGER NOT NULL
      );

      INSERT INTO orders
        (id, user_id, product, amount)
      VALUES
        (1, 1, 'Keyboard', 8000),
        (2, 2, 'Mouse', 3000),
        (3, 1, 'Monitor', 25000),
        (4, 4, 'Headphones', 12000);
    `);

    return db;
  }


  // ==============================
  // SQL.js初期化
  // ==============================

  async function initialize() {

    SQL = await initSqlJs({

      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`

    });

    renderQuestionList();

    loadQuestion(0);

    updateProgress();

  }


  // ==============================
  // 問題一覧
  // ==============================

  function renderQuestionList() {

    const list =
      document.getElementById("questionList");

    list.innerHTML = "";

    questions.forEach((question, index) => {

      const button =
        document.createElement("button");

      button.className =
        "question-button";

      if (index === currentQuestionIndex) {
        button.classList.add("active");
      }

      if (solvedQuestions.has(index)) {
        button.classList.add("correct");
      }

      button.textContent =
        `${solvedQuestions.has(index) ? "✓ " : ""}${question.title}`;

      button.addEventListener(
        "click",
        () => loadQuestion(index)
      );

      list.appendChild(button);

    });

  }


  // ==============================
  // 問題読み込み
  // ==============================

  function loadQuestion(index) {

    currentQuestionIndex = index;

    const question =
      questions[index];

    document.getElementById(
      "questionTitle"
    ).textContent =
      question.title;

    document.getElementById(
      "questionText"
    ).textContent =
      question.text;

    document.getElementById(
      "schema"
    ).textContent =
      question.schema;

    document.getElementById(
      "sqlInput"
    ).value =
      question.starter;

    document.getElementById(
      "result"
    ).innerHTML = "";

    hideMessage();

    renderQuestionList();

  }


  // ==============================
  // SQL実行
  // ==============================

  function runSQL() {

    const sql =
      document.getElementById(
        "sqlInput"
      ).value.trim();

    if (!sql) {

      showMessage(
        "SQLを入力してください。",
        "error"
      );

      return;

    }

    const db =
      createDatabase();

    try {

      const results =
        db.exec(sql);

      displayResults(results);

      showMessage(
        "SQLを実行しました。",
        "info"
      );

    }

    catch (error) {

      document.getElementById(
        "result"
      ).innerHTML = "";

      showMessage(
        `SQLエラー: ${error.message}`,
        "error"
      );

    }

    finally {

      db.close();

    }

  }


  // ==============================
  // 正解判定
  // ==============================

  function judgeSQL() {

    const sql =
      document.getElementById(
        "sqlInput"
      ).value.trim();

    if (!sql) {

      showMessage(
        "SQLを入力してください。",
        "error"
      );

      return;

    }

    const question =
      questions[currentQuestionIndex];

    const userDB =
      createDatabase();

    const answerDB =
      createDatabase();

    try {

      const userResult =
        userDB.exec(sql);

      const answerResult =
        answerDB.exec(question.answer);

      displayResults(userResult);


      if (
        compareResults(
          userResult,
          answerResult
        )
      ) {

        solvedQuestions.add(
          currentQuestionIndex
        );

        showMessage(
          "正解です！ 🎉",
          "success"
        );

        renderQuestionList();

        updateProgress();

      }

      else {

        showMessage(
          "不正解です。実行結果を確認して、もう一度考えてみてください。",
          "error"
        );

      }

    }

    catch (error) {

      showMessage(
        `SQLエラー: ${error.message}`,
        "error"
      );

    }

    finally {

      userDB.close();
      answerDB.close();

    }

  }


  // ==============================
  // 結果比較
  // ==============================

  function compareResults(
    userResults,
    answerResults
  ) {

    if (
      userResults.length !==
      answerResults.length
    ) {
      return false;
    }


    for (
      let i = 0;
      i < userResults.length;
      i++
    ) {

      const user =
        userResults[i];

      const answer =
        answerResults[i];


      if (
        JSON.stringify(user.columns) !==
        JSON.stringify(answer.columns)
      ) {
        return false;
      }


      if (
        JSON.stringify(user.values) !==
        JSON.stringify(answer.values)
      ) {
        return false;
      }

    }

    return true;

  }


  // ==============================
  // 結果表示
  // ==============================

  function displayResults(results) {

    const resultDiv =
      document.getElementById(
        "result"
      );

    resultDiv.innerHTML = "";


    if (results.length === 0) {

      resultDiv.textContent =
        "SQLは正常に実行されました。";

      return;

    }


    results.forEach(result => {

      const table =
        document.createElement("table");


      const thead =
        document.createElement("thead");

      const headerRow =
        document.createElement("tr");


      result.columns.forEach(column => {

        const th =
          document.createElement("th");

        th.textContent =
          column;

        headerRow.appendChild(th);

      });


      thead.appendChild(headerRow);

      table.appendChild(thead);


      const tbody =
        document.createElement("tbody");


      result.values.forEach(row => {

        const tr =
          document.createElement("tr");


        row.forEach(value => {

          const td =
            document.createElement("td");

          td.textContent =
            value === null
              ? "NULL"
              : value;

          tr.appendChild(td);

        });


        tbody.appendChild(tr);

      });


      table.appendChild(tbody);

      resultDiv.appendChild(table);

    });

  }


  // ==============================
  // リセット
  // ==============================

  function resetInput() {

    document.getElementById(
      "sqlInput"
    ).value =
      questions[
        currentQuestionIndex
      ].starter;

    document.getElementById(
      "result"
    ).innerHTML = "";

    hideMessage();

  }


  // ==============================
  // メッセージ
  // ==============================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );

    message.textContent =
      text;

    message.className =
      `message ${type}`;

  }


  function hideMessage() {

    const message =
      document.getElementById(
        "message"
      );

    message.textContent = "";

    message.className =
      "message";

  }


  // ==============================
  // 進捗
  // ==============================

  function updateProgress() {

    document.getElementById(
      "progress"
    ).textContent =
      `正解数: ${solvedQuestions.size} / ${questions.length}`;

  }


  // ==============================
  // ボタン
  // ==============================

  document.getElementById(
    "runButton"
  ).addEventListener(
    "click",
    runSQL
  );


  document.getElementById(
    "judgeButton"
  ).addEventListener(
    "click",
    judgeSQL
  );


  document.getElementById(
    "resetButton"
  ).addEventListener(
    "click",
    resetInput
  );


  initialize();

</script>

</body>
</html>
